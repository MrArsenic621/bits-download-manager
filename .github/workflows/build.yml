name: Build and release

# Builds the Tauri app on Windows and publishes the installers
# (NSIS setup.exe + MSI) as release artifacts when a version tag is pushed.
on:
  push:
    # Publish semver tags as releases.
    tags:
      - "v*.*.*"
  # Allow manual builds from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: bun install

      - name: Set release version from tag
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          if (-not $ver -or $ver -eq "main") { $ver = "2.0.0" }
          Write-Host "Setting project version to $ver"
          
          # Update tauri.conf.json
          $tauriCfg = Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json
          $tauriCfg.version = $ver
          $tauriCfg | ConvertTo-Json -Depth 10 | Set-Content src-tauri/tauri.conf.json

          # Update package.json
          $pkg = Get-Content package.json | ConvertFrom-Json
          $pkg.version = $ver
          $pkg | ConvertTo-Json -Depth 10 | Set-Content package.json

      - name: Build Tauri app
        # Runs `tsc && vite build` (beforeBuildCommand), then the release
        # cargo build and bundles the MSI + NSIS installers.
        run: bun run tauri build

      - name: Upload installers as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bits-download-manager-windows
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msi/*.msi
